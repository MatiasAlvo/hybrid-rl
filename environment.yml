name: exp_neural
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core Python and scientific computing
  - python=3.10.12
  - numpy>=1.21.0
  - pandas>=1.4.0
  - scipy>=1.8.0
  # Not imported by src/ or sweep.py; used only in some notebooks (optional)
  - scikit-learn>=1.1.0
  
  # PyTorch ecosystem (torchvision/torchaudio are not imported by src/; safe to drop for a slimmer env)
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # or 12.1 depending on your CUDA version
  
  # Visualization and plotting
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  
  # Jupyter and development
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  
  # Data handling and utilities
  - pyyaml>=6.0
  - tqdm>=4.60.0
  - pillow>=9.0.0
  
  # RL and simulation
  - gymnasium>=0.28.0
  
  # Package manager
  - pip
  
  # Pip-only packages
  - pip:
    # Core RL libraries (required: InventoryEnv / data_handling)
    - torchrl>=0.2.0
    - tensordict>=0.2.0
    
    # Logging (SummaryWriter is imported in src/utils/logger.py even when TB logging is off)
    - wandb>=0.15.0
    - tensorboard>=2.10.0
    
    # Tests (see tests/requirements.txt)
    - pytest>=6.0.0
    
    # Distributed sweeps (sweep.py)
    - ray[default]>=2.5.0
    
    # notebooks/examples/censored_demand.ipynb
    - lifelines>=0.27.0
    
    # Optional: not imported by src/ or sweep.py; keep for notebooks / ad-hoc analysis
    - openpyxl>=3.0.0
    - statsmodels>=0.13.0
    - beautifulsoup4>=4.11.0
    - requests>=2.28.0
    - plotly>=5.0.0
    - plotly-orca>=1.3.0
    - jupyter-dash>=0.4.0
    - memory-profiler>=0.60.0
    - psutil>=5.9.0