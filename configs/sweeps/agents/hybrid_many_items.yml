# Hybrid Agent Sweep Configuration
config_files:
  hyperparams: 'configs/policies/hybrid_many_items.yml'

method: 'random'
metric:
  name: 'dev/loss/best'
  goal: 'minimize'

parameters:
  anneal_lr:
    values:
      - false  # Fixed: 60% of top performers used false
  buffer_periods:
    values:
      - 20  # Fixed: median of top performers
  clip_coef:
    values:
      - 0.16  # Fixed: median of top performers
  gae_lambda:
    values:
      - 0.98
  gamma:
    values:
      - 0.995
  learning_rate:
    distribution: log_uniform_values
    max: 0.01
    min: 0.0008
  max_grad_norm:
    values:
      - 5.0  # Fixed: median of top performers
  normalize_advantages:
    values:
      - true
  normalize_observations:
    values:
      - false
  num_epochs:
    values:
      - 3
      - 1
  disable_cross_term:
    values:
      - true
      - false
  pathwise_coef:
    distribution: uniform
    max: 5.0
    min: 1.0
  policy_activation:
    values:
      - Tanh  # Fixed: 90% of top performers used Tanh
  reward_scaling:
    values:
      - true
  reward_scaling_pathwise:
    values:
      - true
  use_gae:
    values:
      - true
  value_activation:
    values: 
      - Tanh
  value_function_coef:
    values:
      - 0.13  # Fixed: median of top performers
  continuous_scale:
    values:
      - 1.0
  continuous_shift:
    values: 
      - 5.0  # Fixed: median of top performers (changed from 1.0 to 1)
  use_wandb:
    values:
      - true