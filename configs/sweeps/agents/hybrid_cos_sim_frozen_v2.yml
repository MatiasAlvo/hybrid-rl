# Hybrid Agent Sweep Configuration
config_files:
  hyperparams: 'configs/policies/hybrid_cos_sim_frozen_v2.yml'

method: 'grid'
metric:
  name: 'dev/loss/best'
  goal: 'minimize'

parameters:
  use_wandb:
    values:
      - true
  sweep_top_k_split_by:
    values:
      - "n_stores"
  trainer_epochs:
    values:
      - 600
