# Fixed-mode LQR Riccati sweep configuration
config_files:
  hyperparams: 'configs/policies/fixed_mode_lqr_riccati.yml'

method: 'grid'
metric:
  name: 'dev/loss/best'
  goal: 'minimize'

parameters:
  fixed_lqr_mode:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
use_wandb:
  values:
    - true
