# Add wandb tracking configuration
wandb_config:
  group: "multi_lead_time_lost"  # This will be the group name in wandb
  # You can add additional tracking parameters here as needed
  track_params:
    - ["problem_params.discrete_features.multi_lead_time_lost.values.1", "multi_lead_time_lost"]

sample_data_params:
  'split_by_period': false
  'train_periods': null
  'dev_periods': null
  'test_periods': null

problem_params: 
  'setting_name': "one_store_multi_lead_time_lost"
  'n_stores': 1
  'n_warehouses': 0
  'n_extra_echelons': 0
  'lost_demand': true
  'maximize_profit': false
  'is_hybrid': true
  'discrete_features': 
    'multi_lead_time': 
      'thresholds': [0.0, 4.4, inf]  # first and last values are the same across all discrete features
      'values': [2.0, 3.0]
      # 'thresholds': [0.0, 10.0, inf]  # first and last values are the same across all discrete features
      # 'values': [2.0, 3.0]

observation_params:
  'include_warehouse_inventory': False
  'include_static_features':
    'holding_costs': True 
    'underage_costs': True 
    'procurement_costs': True 
    'lead_times': True 
    'upper_bounds': False
    'mean': False
    'std': False
  'demand': 
    'past_periods': 0 
    'period_shift': 0
  'include_past_observations':
    'arrivals': 0
    'orders': 0
  'time_features_file': null
  'time_features': null
  'sample_features_file': null
  'sample_features': null
  'normalize_observations': false

store_params: 
  'demand': 
    'distribution': 'poisson'
    'mean': 5.0
    'sample_across_stores': False
    'expand': False
    'clip': False
    'decimals': 3
  'lead_time': 
    'value': 3 # has to be at least as large as the max lead time
    'vary_across_samples': False
    'sample_across_stores': False
    'expand': True
  'holding_cost': 
    'value': 1.0
    'vary_across_samples': False
    'sample_across_stores': False
    'expand': True
  'underage_cost': 
    'value': 9.0
    'vary_across_samples': False
    'sample_across_stores': False
    'expand': True
  'initial_inventory': 
    'sample': False
    'inventory_periods': 3 # has to be at least as large as the max lead time
  'procurement_cost':
    'value': 0.0
    'vary_across_samples': False
    'sample_across_stores': False
    'expand': True

warehouse_params: 
  'holding_cost': 0.3
  'lead_time': 4

echelon_params: 
  null

params_by_dataset : 
  'train': 
    'n_samples': 1024 
    'batch_size': 128  # Values tested: 1024, 8192
    'periods': 100 
    'ignore_periods': 16 
  'dev': 
    'n_samples': 1024 
    'batch_size': 128 
    'periods': 100 
    'ignore_periods': 16 
  'test': 
