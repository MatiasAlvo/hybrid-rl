trainer_params:
  epochs: 300
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: False
  load_model_path: 'models/saved_models/2025_10_22/one_store_fixed_costs/hybrid_policy/1761149697_246.pt'
  base_dir: models/saved_models
  compute_metrics_on_test: false
  sweep_top_k: 3

logging_params:
  use_wandb: false  # Overridden by sweep config
  use_tensorboard: false
  wandb_project_name: inventory_control
  wandb_entity: alvomatias
  exp_name: hybrid
  env_name: inventory
  setting_name: one_store_fixed_costs
  # setting_name: one_store_multi_lead_time_lost
  # setting_name: fixed_costs_not_at_zero
  log_inventory_action_plot: false
  log_inventory_value_plot: false
  log_inventory_discrete_action0_prob_plot: true
  normalize_plots_by_mean_demand: false

agent_params:
  agent_type: hybrid
  initial_temperature: 1.0
  min_temperature: 0.001
  temperature_decay: 0.997
  use_straight_through: false
  add_gumbel_noise: false

optimizer_params:
  # learning_rate: 0.01  # Overridden by sweep config
  learning_rate: 0.003  # Overridden by sweep config
  anneal_lr: false  # Overridden by sweep config
  weight_decay: 0.0
  skip_update_every_n_epochs: 5
  lr_multipliers:
    value: 1.0
    backbone: 1.0
    continuous: 1.0
    discrete: 1.0
    other: 1.0
  ppo_params:
    clip_coef: 0.16  
    gamma: 0.93  # changed from 0.95 to 0.93
    reinforce_gamma: 0.99
    gae_lambda: 0.96
    normalize_advantages: true  # changed from false to true
    use_gae: true
    num_epochs: 5  # changed from 1 to 5
    num_minibatches: 4
    value_function_coef: 0.13
    pathwise_coef: 10.0  # changed from 1.0 to 10.0
    reward_scaling_pathwise: true  
    reward_scaling: true  
    buffer_periods: 20  
    # max_grad_norm: 10000000000000.0 
    max_grad_norm: 5.0 
    entropy_coef: 0.0
    clip_by_component: true
    cosine_grad_analysis: true
    use_reinforce_loss: true
    disable_cross_term: false

nn_params:
  policy_network:
    name: separate_network_policy
    # name: hybrid_policy
    input_size: null
    hidden_layers: [64, 64]
    activation: Tanh  # Overridden by sweep config (policy_activation)
    dropout: 0.0
    batch_norm: false
    continuous_scale: 1.0  # Overridden by sweep config
    continuous_shift: 5.0  # Overridden by sweep config
    observation_keys: ['store_inventories']
    normalize_by_mean_demand: True
    ewma_beta: 0.99
    heads:
      discrete:
        enabled: true
        size: 0
        activation: Linear
      continuous:
        enabled: true
        size: 0
        activation: Linear

  value_network:
    enabled: true
    input_size: 2
    hidden_layers: [64, 64]
    activation: Tanh  # Overridden by sweep config (value_activation)
    dropout: 0.0
    batch_norm: false
    output_size: 1