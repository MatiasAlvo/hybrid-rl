trainer_params:
  # epochs: 1
  epochs: 400
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: false
  base_dir: models/saved_models
  compute_metrics_on_test: false
  sweep_top_k: 1
  # reset_param_groups: ["discrete"]

logging_params:
  use_wandb: false  # Overridden by sweep config
  use_tensorboard: false
  wandb_project_name: inventory_control
  wandb_entity: alvomatias
  exp_name: hybrid_cos_sim
  env_name: inventory
  setting_name: one_store_fixed_costs
  # setting_name: one_store_multi_lead_time_lost
  # setting_name: fixed_costs_not_at_zero
  log_inventory_action_plot: false
  dump_inventory_action_plot_data: false
  inventory_action_plot_dump_only: false
  inventory_action_plot_dump_per_epoch: false
  inventory_action_plot_dump_single_file: false
  inventory_action_plot_dump_dir: artifacts/inventory_action_plot_data
  log_inventory_value_plot: false
  log_inventory_discrete_action0_prob_plot: false
  normalize_plots_by_mean_demand: false

agent_params:
  agent_type: hybrid_cos_sim
  initial_temperature: 1.0
  min_temperature: 0.001
  temperature_decay: 1.0
  use_straight_through: false
  add_gumbel_noise: false
  fixed_std: 1.0 # we will shift using degradation_scale_by_store
  # fixed_std: 0.0 # we will shift using degradation_scale_by_store

optimizer_params:
  learning_rate: 0.0002  # Overridden by sweep config
  # learning_rate: 0.00002  # Overridden by sweep config
  # learning_rate: 0.00001  # Overridden by sweep config
  anneal_lr: false  # Overridden by sweep config
  weight_decay: 0.0
  skip_update_every_n_epochs: 2
  lr_multipliers:
    value: 10.0
    backbone: 1.0
    continuous: 1.0
    discrete: 1.0
    other: 1.0
  ppo_params:
    clip_coef: 0.16  # Overridden by sweep config
    gamma: 0.98  # Same as
    reinforce_gamma: 0.98
    pathwise_gamma: 0.98
    gae_lambda: 1.0  # Overridden by sweep config
    normalize_advantages: false  # Overridden by sweep config
    use_gae: false  # Overridden by sweep config
    num_epochs: 1  # Overridden by sweep config
    value_function_coef: 0.13  # Overridden by sweep config
    pathwise_coef: 1.0  # Overridden by sweep config
    reward_scaling_pathwise: true  # Overridden by sweep config
    reward_scaling: true  # Overridden by sweep config
    buffer_periods: 20  # Overridden by sweep config
    max_grad_norm: 100.0  # Overridden by sweep config
    entropy_coef: 0.0
    clip_by_component: true
    disable_cross_term: False
    cosine_grad_analysis: True
    grad_analysis: false
    # alignment_ds: null
    # alignment_ds: [256]
    alignment_ds: [256, 512, 1024]
    # alignment_repeats: null
    alignment_repeats: 100
    num_minibatches: 1
    use_reinforce_loss: true
    pathwise_bootstrap_value: true
    loss_schedule:
      # warmup_epochs: 0
      warmup_epochs: 80
      warmup_lr_multipliers:
        value: 100.0
        backbone: 0.0
        continuous: 0.0
        discrete: 0.0
        other: 0.0
      policy_value: 0
      pathwise: 0

nn_params:
  policy_network:
    name: separate_network_policy
    # name: hybrid_policy
    input_size: null
    hidden_layers: [256, 256]
    # hidden_layers: [64, 64]
    # activation: ELU  # Overridden by sweep config (policy_activation)
    activation: Tanh  # Overridden by sweep config (policy_activation)
    dropout: 0.0
    batch_norm: false
    continuous_scale: 1.0  # Overridden by sweep config
    continuous_shift: 1.0  # on original training: 1.0. we will shift using degradation_scale_by_store
    # continuous_shift: 4.5  # on original training: 1.0
    # continuous_shift: 10.0  # on original training: 1.0
    observation_keys: ['store_inventories']
    normalize_by_mean_demand: true
    heads:
      discrete:
        enabled: true
        size: 0
        activation: Linear
      continuous:
        enabled: true
        size: 0
        activation: Linear

  value_network:
    enabled: true
    input_size: 2
    hidden_layers: [256, 256]
    activation: Tanh  # Overridden by sweep config (value_activation)
    dropout: 0.0
    batch_norm: false
    output_size: 1