trainer_params:
  epochs: 200
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: False
  load_model_path: 'models/saved_models/2025_10_22/one_store_fixed_costs/hybrid_policy/1761149697_246.pt'
  base_dir: models/saved_models
  compute_metrics_on_test: false
  sweep_top_k: 0

logging_params:
  use_wandb: false  
  use_tensorboard: false
  wandb_project_name: inventory_control
  wandb_entity: alvomatias
  exp_name: hybrid_separate_net
  env_name: inventory
  setting_name: one_store_fixed_costs
  log_inventory_action_plot: false
  log_inventory_value_plot: false
  log_inventory_discrete_action0_prob_plot: false
  normalize_plots_by_mean_demand: false

agent_params:
  agent_type: hybrid
  initial_temperature: 1.0
  min_temperature: 0.001
  temperature_decay: 0.997
  use_straight_through: false
  add_gumbel_noise: false

optimizer_params:
  learning_rate: 0.001  
  anneal_lr: false  
  weight_decay: 0.0
  lr_multipliers:
    value: 1.0
    backbone: 1.0
    continuous: 1.0
    discrete: 1.0
    other: 1.0
  ppo_params:
    clip_coef: 0.15  
    gamma: 0.93  
    gae_lambda: 0.96  
    normalize_advantages: true  
    use_gae: true  
    num_epochs: 5  
    value_function_coef: 0.15  
    pathwise_coef: 5.0  
    reward_scaling_pathwise: true  
    reward_scaling: true  
    buffer_periods: 20  
    max_grad_norm: 5.0  
    entropy_coef: 0.5
    anneal_entropy_coef: true
    min_entropy_coef: 0.001
    clip_by_component: true
    disable_cross_term: false
    grad_analysis: false
    cosine_grad_analysis: false
    # alignment_ds: [16, 32, 64]
    # alignment_repeats: 100

nn_params:
  policy_network:
    name: separate_network_policy
    # name: hybrid_policy
    input_size: null
    hidden_layers: [512, 512]
    activation: Tanh
    init_discrete_uniform: true
    dropout: 0.0
    batch_norm: false
    continuous_scale: 1.0  
    continuous_shift: 1.0  
    observation_keys: ['store_inventories', 'underage_costs', 'holding_costs', 'mean']
    normalize_by_mean_demand: true
    heads:
      discrete:
        enabled: true
        size: 0
        activation: Linear
      continuous:
        enabled: true
        size: 0
        activation: Linear

  value_network:
    enabled: true
    input_size: null
    hidden_layers: [512, 512]
    activation: Tanh
    dropout: 0.0
    batch_norm: false
    output_size: 1