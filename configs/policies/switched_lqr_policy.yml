trainer_params:
  epochs: 1
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: false
  base_dir: models/saved_models
  compute_metrics_on_test: false

logging_params:
  use_wandb: false
  use_tensorboard: false
  wandb_project_name: inventory_control
  wandb_entity: alvomatias
  exp_name: switched_lqr_policy
  env_name: lqr_switched
  setting_name: lqr_switched
  log_inventory_action_plot: false
  log_inventory_value_plot: false
  log_inventory_discrete_action0_prob_plot: false
  normalize_plots_by_mean_demand: false

agent_params:
  agent_type: switched_lqr_policy
  # Optional override:
  # lqr_policy_P_matrices:
  #   - [[6.065, 1.206], [1.206, 1.905]]
  #   - [[9.087, 3.235], [3.235, 2.348]]
  #   - [[5.108, 1.266], [1.266, 1.935]]
  #   - [[7.219, 2.561], [2.561, 2.107]]

optimizer_params:
  learning_rate: 0.003
  anneal_lr: false
  weight_decay: 0.0
  lr_multipliers:
    value: 1.0
    backbone: 1.0
    continuous: 1.0
    discrete: 1.0
    other: 1.0
  ppo_params:
    clip_coef: 0.16
    gamma: 0.93
    gae_lambda: 0.96
    normalize_advantages: true
    use_gae: true
    num_epochs: 1
    value_function_coef: 0.13
    pathwise_coef: 0.0
    reward_scaling_pathwise: false
    reward_scaling: false
    buffer_periods: 1
    max_grad_norm: 5.0
    entropy_coef: 0.0
    anneal_entropy_coef: false
    min_entropy_coef: 0.0
    clip_by_component: true
    disable_cross_term: false
    grad_analysis: false
    cosine_grad_analysis: false

nn_params:
  policy_network:
    name: separate_network_policy
    input_size: null
    hidden_layers: [64, 64]
    activation: Tanh
    init_discrete_uniform: true
    dropout: 0.0
    batch_norm: false
    continuous_scale: 1.0
    continuous_shift: 0.0
    observation_keys: ['store_inventories']
    normalize_by_mean_demand: false
    heads:
      discrete:
        enabled: true
        size: 0
        activation: Linear
      continuous:
        enabled: true
        size: 0
        activation: Linear

  value_network:
    enabled: false
    input_size: 2
    hidden_layers: [64, 64]
    activation: Tanh
    dropout: 0.0
    batch_norm: false
    output_size: 1
