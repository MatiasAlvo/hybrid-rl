trainer_params:
  epochs: 250
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: False
  load_model_path: 'models/saved_models/2025_10_22/one_store_fixed_costs/hybrid_policy/1761149697_246.pt'
  base_dir: models/saved_models
  compute_metrics_on_test: false

logging_params:
  use_wandb: true
  use_tensorboard: false
  wandb_project_name: inventory_control
  wandb_entity: alvomatias
  exp_name: fixed_continuous_baseline
  env_name: inventory
  setting_name: one_store_fixed_costs
  log_inventory_action_plot: true
  log_inventory_value_plot: true
  log_inventory_discrete_action0_prob_plot: true
  normalize_plots_by_mean_demand: false

agent_params:
  agent_type: fixed_continuous_hybrid
  fixed_base_stock_level: 62
  initial_temperature: 1.0
  min_temperature: 0.001
  temperature_decay: 0.997
  use_straight_through: false
  add_gumbel_noise: false

optimizer_params:
  learning_rate: 0.0003
  anneal_lr: false
  weight_decay: 0.0
  lr_multipliers:
    value: 1.0
    backbone: 1.0
    continuous: 1.0
    discrete: 1.0
    other: 1.0
  ppo_params:
    clip_coef: 0.16
    gamma: 0.93
    gae_lambda: 0.96
    normalize_advantages: true
    use_gae: true
    num_epochs: 5
    value_function_coef: 0.13
    pathwise_coef: 10.0
    reward_scaling_pathwise: true
    reward_scaling: true
    buffer_periods: 20
    max_grad_norm: 5.0
    entropy_coef: 0.0
    clip_by_component: true

nn_params:
  policy_network:
    name: hybrid_policy
    input_size: null
    hidden_layers: [64, 64]
    activation: Tanh
    dropout: 0.0
    batch_norm: false
    continuous_scale: 1.0
    continuous_shift: 5.0
    observation_keys: ['store_inventories']
    normalize_by_mean_demand: False
    heads:
      discrete:
        enabled: true
        size: 0
        activation: Linear
      continuous:
        enabled: true
        size: 0
        activation: Linear

  value_network:
    enabled: true
    input_size: 2
    hidden_layers: [64, 64]
    activation: Tanh
    dropout: 0.0
    batch_norm: false
    output_size: 1
trainer_params:
  epochs: 250
  do_dev_every_n_epochs: 1
  print_results_every_n_epochs: 1
  save_model: false
  epochs_between_save: 1
  choose_best_model_on: dev_loss
  load_previous_model: False
